

plugins {
    id 'idea'
    id 'java'
    id 'org.jetbrains.intellij' version '0.6.5'
    id "org.jetbrains.kotlin.jvm" version "1.5.30"
}

apply plugin: "idea"
apply plugin: 'kotlin'

group = "org.oorexx.idea"
version = "2.0.4-GA"

sourceCompatibility = 1.11

def ooRexxDocDependencyPath = project.findProperty('ooRexxDocDependencyPath')

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':oorexxdoc')
    implementation project(':lang')
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.0.3'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.0.3'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.5.30'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-xml:2.12.5'
    //testImplementation files("${ooRexxDocDependencyPath}/Grammar-Kit-f75d0d8.jar")
    testImplementation files("file:///home/alex/.gradle/caches/modules-2/files-2.1/com.github.JetBrains/Grammar-Kit/6452fde524/ad85d3f6b98f932b92a8bb322688b78eb68d26ee/Grammar-Kit-6452fde524.jar")


}

intellij {
    // Define IntelliJ Platform API version to use for building this plugin
    version '2021.2'
}

test {
    useJUnitPlatform()
}
sourceSets {
    main.kotlin.srcDirs += 'src/main/kotlin'
    main.java.srcDirs += 'src/main/java'
    main.resources.srcDirs += 'src/main/resources'

    test.java.srcDirs += 'test/java'
    test.kotlin.srcDirs += 'test/kotlin'
    test.resources.srcDirs += 'test/resources'
}

rootProject.tasks.named("processResources") {
    duplicatesStrategy = 'include'
}
