allprojects {
    apply plugin: 'java'

    group 'org.oorexx.idea'
    version '2.0.5-GA'

    sourceCompatibility = 1.11
    targetCompatibility = 1.11

    repositories {
        mavenCentral()
    }

}

project(':oorexxdoc') {

    dependencies {
        implementation project(':lang')
    }
}

project(':plugin') {
    dependencies {
        implementation project(':oorexxdoc')
    }
}